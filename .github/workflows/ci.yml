name: CI

# Runs on pull requests, manually, and when deploy.yml calls it before publishing.
# Rules come from templates/code-hygiene-checklist.md; see docs/ci.md.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:stats

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Checks the files that start with "// @ts-check" (see tsconfig.json).
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Lints the whole tree with --max-warnings=0 (see eslint.config.mjs for the rules).
      - run: npm run lint

  hygiene:
    name: Hygiene
    # Needs a base to compare against, so it only runs for pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Write PR description to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: Check commits, branch, new files and PR description
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          # Bots can't follow the wording templates; they still get the safety checks.
          SKIP_STYLE: ${{ endsWith(github.actor, '[bot]') && '--skip-style' || '' }}
        run: >
          node scripts/ci/check-hygiene.mjs
          --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$BRANCH"
          --pr-body-file "$RUNNER_TEMP/pr-body.md" $SKIP_STYLE

  e2e:
    name: End-to-end (Cypress)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Installs dependencies (with the Cypress binary, cached), starts server.js,
      # waits for it to answer, then runs every spec in cypress/e2e/ in headless Chrome.
      - uses: cypress-io/github-action@v7
        with:
          start: npm start
          wait-on: 'http://localhost:3000'
          browser: chrome
      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
